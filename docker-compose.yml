version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sentiment-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentiment-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sentiment-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sentiment-network
    restart: unless-stopped

  ingester:
    build:
      context: ./ingester
      dockerfile: Dockerfile
    container_name: sentiment-ingester
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_STREAM_NAME: ${REDIS_STREAM_NAME}
      POSTS_PER_MINUTE: ${POSTS_PER_MINUTE:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sentiment-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    container_name: sentiment-worker
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_STREAM_NAME: ${REDIS_STREAM_NAME}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP}
      DATABASE_URL: ${DATABASE_URL}
      HUGGINGFACE_MODEL: ${HUGGINGFACE_MODEL}
      EMOTION_MODEL: ${EMOTION_MODEL}
      EXTERNAL_LLM_PROVIDER: ${EXTERNAL_LLM_PROVIDER}
      EXTERNAL_LLM_API_KEY: ${EXTERNAL_LLM_API_KEY}
      EXTERNAL_LLM_MODEL: ${EXTERNAL_LLM_MODEL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentiment-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentiment-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_STREAM_NAME: ${REDIS_STREAM_NAME}
      REDIS_CACHE_PREFIX: ${REDIS_CACHE_PREFIX}
      ALERT_NEGATIVE_RATIO_THRESHOLD: ${ALERT_NEGATIVE_RATIO_THRESHOLD:-2.0}
      ALERT_WINDOW_MINUTES: ${ALERT_WINDOW_MINUTES:-5}
      ALERT_MIN_POSTS: ${ALERT_MIN_POSTS:-10}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentiment-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentiment-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    depends_on:
      - backend
    networks:
      - sentiment-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  sentiment-network:
    driver: bridge

